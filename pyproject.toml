# Tool configuration only (dependencies live in requirements.txt).

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "frontend", "ml/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
